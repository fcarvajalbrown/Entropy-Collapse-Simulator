entropy_robustness_simulator/
│
├── core/
│   └── models.py           ← shared dataclasses (Material, Node, Member,
│                              FrameData, EnergyState, EntropyRecord, ...)
│
├── structure/
│   ├── stiffness.py        ← planar Euler-Bernoulli assembly, transformation, BCs
│   └── frames/
│       ├── frame_2d_simple.py
│       ├── frame_building_2d.py
│       └── frame_pratt_bridge.py
│
├── solver/
│   ├── equilibrium.py      ← Ku=F (solve / solve_full), per-member strain energy
│   └── failure.py          ← combined axial+bending stress failure criterion
│
├── entropy/
│   ├── metrics.py          ← S, dS, normalized entropy, max entropy
│   ├── localization.py     ← causal z-score / threshold detection, Gini index
│   └── robustness.py       ← Entropy Robustness Index R_S (alternate load path)
│
├── analysis/
│   └── criteria.py         ← four-criteria head-to-head comparison
│
├── simulation/
│   ├── runner.py           ← progressive-collapse loop (removal + re-analysis)
│   └── scenarios.py        ← scenario registry
│
├── visualization/
│   ├── graph_view.py
│   ├── entropy_plot.py
│   └── animation.py
│
├── tests/                  ← 9-phase test suite
├── benchmark.py            ← validation (analytical + independent dual solver)
├── THEORY.md               ← mathematical basis
├── main.py                 ← CLI (modes: simulate / robustness / criteria)
├── requirements.txt
└── README.md

Notes:
- Planar (2D), first-order linear-elastic Euler-Bernoulli frames only.
- Energy redistribution after a failure is modelled by member removal +
  re-analysis (no phenomenological diffusion law).
- All inter-module communication is through core/models.py dataclasses.
