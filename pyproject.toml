[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "entropy-robustness-simulator"
version = "0.1.0"
description = "Planar structural robustness and progressive-collapse tool using the Shannon entropy of the strain-energy distribution (Entropy Robustness Index)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "GPL-3.0-or-later" }
authors = [
    { name = "Felipe Carvajal Brown", email = "fcarvajalbrown@gmail.com" }
]
keywords = ["structural engineering", "progressive collapse", "robustness", "entropy", "FEM", "alternate load path", "finite element method", "truss", "redundancy"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "numpy>=1.26",
    "matplotlib>=3.8",
    "Pillow>=10.0",
]

[project.scripts]
entropy-robustness = "main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["analysis*", "core*", "entropy*", "simulation*", "solver*", "structure*", "visualization*"]